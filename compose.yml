services:
  mongo:
    image: mongo:7.0@sha256:9650758f83af117fc96699f030a44f9300bed839734e67012f56df05b2fd6290
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    read_only: true
    tmpfs:
      - /tmp
      - /data/configdb
    cap_drop:
      - ALL
    # The upstream entrypoint starts as root and drops to the mongodb user via
    # gosu/chown; these are the minimum capabilities that step needs.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true

  cwmp:
    build: .
    command: genieacs-cwmp
    restart: unless-stopped
    depends_on:
      - mongo
    environment: &genieacs-environment
      GENIEACS_MONGODB_CONNECTION_URL: mongodb://mongo/genieacs
      GENIEACS_CWMP_WORKER_PROCESSES: 1
      GENIEACS_NBI_WORKER_PROCESSES: 1
      GENIEACS_UI_WORKER_PROCESSES: 1
      # No insecure default: .env must set a real secret, or startup fails.
      GENIEACS_UI_JWT_SECRET: ${GENIEACS_UI_JWT_SECRET:?GENIEACS_UI_JWT_SECRET must be set in .env (see .env.example)}
    ports:
      # CWMP has no server-side authentication in this lab stack; bind to the
      # trusted LAN interface only, never 0.0.0.0. Set LAN_IP in .env.
      - "${LAN_IP:-127.0.0.1}:7547:7547"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  nbi:
    build: .
    command: genieacs-nbi
    restart: unless-stopped
    depends_on:
      - mongo
    environment: *genieacs-environment
    # Loopback-only, for local debugging; the bridge reaches this service over
    # the internal compose network as http://nbi:7557 and does not need this
    # port published. Remove the mapping entirely if you don't use it.
    ports:
      - "127.0.0.1:7557:7557"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  ui:
    build: .
    command: genieacs-ui
    restart: unless-stopped
    depends_on:
      - mongo
    environment: *genieacs-environment
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    restart: unless-stopped
    depends_on:
      - nbi
    environment:
      GENIEACS_URL: http://nbi:7557
      PUBLIC_URL: http://127.0.0.1:8090
      LISTEN_HOST: 0.0.0.0
      STATE_DIR: /data
      UNIFI_INFORM_URL: ${UNIFI_INFORM_URL:-}
      UNIFI_WLAN_MAP: ${UNIFI_WLAN_MAP:-}
      HUAWEI_CONTROL_IP: ${HUAWEI_CONTROL_IP:-}
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - bridge-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mongo-data:
  bridge-data:
